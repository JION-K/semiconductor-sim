# 예시: 실제 적용 전 이름/namespace/값을 바꾸고 Secret을 생성하세요.
# kubectl apply -f semi-fab-db-secret.example.yaml  (파일을 복사해 값 채운 뒤)
#
# 문자열은 평문으로 두면 안 됩니다. 아래 값은 base64가 아닌 stringData(평문)로 넣어도
# kubectl이 저장 시 자동 base64 인코딩합니다.
apiVersion: v1
kind: Secret
metadata:
  name: semi-fab-db
  namespace: skala3-ai1
type: Opaque
stringData:
  # 예: jdbc:postgresql://postgres.default.svc.cluster.local:5432/postgres
  # 예 (RDS): jdbc:postgresql://mydb.xxxx.ap-northeast-2.rds.amazonaws.com:5432/postgres
  jdbc-url: "REPLACE_ME"
  username: "REPLACE_ME"
  password: "REPLACE_ME"
